<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0755b5">
<meta name="msapplication-navbutton-color" content="#0755b5">
<title>Family Luismaux</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#FFF6E5;--card:#FFFCF6;--ink:#3B2A1A;--mute:#8A7560;--pine:#B35A12;--acc:#F5A55A;--sun:#FFD66B;--line:#F3E1C4;--red:#C8412B;--band:#FFE3A3;--t0:#FFE0B8;--t1:#FFEDB5;--t2:#FFD9C0;--t3:#FFF3CC;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1F1710;--card:#2A2016;--ink:#F6EAD9;--mute:#B7A088;--pine:#F5A860;--acc:#E9954A;--line:#3D2E20;--red:#E5735E;--band:#3A2C14;--t0:#4A3220;--t1:#4A3E1C;--t2:#4A2E24;--t3:#443A22;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 12px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em}
.who{font-size:13px;color:var(--mute);text-align:right}
.who button{background:none;border:0;color:var(--pine);font:inherit;text-decoration:underline;padding:0;cursor:pointer}
.bar{display:flex;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px}
input{font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.add{background:var(--acc);color:#2B1B0C;border:0;border-radius:12px;font:inherit;font-weight:600;font-size:17px;padding:0 20px;cursor:pointer}
h2{font-size:15px;font-weight:600;color:var(--pine);margin:22px 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line)}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
li:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--pine);flex:none;display:grid;place-items:center;color:transparent;font-size:15px}
.nm{flex:1;font-size:17px}
.q{font-weight:600;color:var(--pine);font-size:15px}
.done .chk{background:var(--sun);border-color:var(--sun);color:#17231D}
.done .nm{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:0 4px}
.head{display:flex;justify-content:space-between;align-items:center}
.clr{background:none;border:0;color:var(--red);font:inherit;font-size:14px;cursor:pointer;margin-top:18px}
.empty{color:var(--mute);text-align:center;padding:48px 8px}
.login{max-width:420px;margin:6vh auto;padding:0 20px;display:grid;gap:12px}
.login p{color:var(--mute);margin:0 0 6px;line-height:1.4}
.btn2{background:none;border:1.5px solid var(--pine);color:var(--pine);border-radius:12px;font:inherit;font-weight:600;font-size:16px;padding:12px;cursor:pointer}
.btn1{background:var(--acc);color:#2B1B0C;border:0;border-radius:12px;font:inherit;font-weight:600;font-size:17px;padding:14px;cursor:pointer}
.err{color:var(--red);font-size:14px}
.code{font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--pine)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tab{flex:none;font:inherit;font-weight:600;font-size:15px;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab.on{background:var(--pine);border-color:var(--pine);color:#fff}
.tab.plus{border-style:dashed;color:var(--pine)}
.acts{display:flex;gap:16px;font-size:13px;padding-bottom:4px}
.acts button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;padding:0;cursor:pointer}
li.ed{flex-wrap:wrap;cursor:default;gap:8px}
.ed input{flex:1 1 100%}
.ed select{flex:1;font:inherit;font-size:16px;padding:11px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}
.ed .add{padding:10px 18px;font-size:16px}
.ed .btn2{padding:10px 16px;font-size:16px}
.hab{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 8px}
.hab .t{width:100%;font-size:13px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
.cn{font:inherit;font-size:15px;padding:7px 4px 7px 14px;border:0;background:none;color:var(--ink);cursor:pointer}
.cx{border:0;background:none;color:var(--mute);padding:4px 12px 4px 6px;cursor:pointer;font-size:16px}
.top{background:var(--band);color:var(--ink);padding:12px 16px}
.topin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.topin img{border-radius:10px;display:block}
.top h1{font-size:22px;color:var(--ink)}
.who2{font-size:13px;color:var(--mute);padding:12px 0 8px}
.who2 b{color:var(--pine);letter-spacing:.08em;font-size:15px}
.who2 button{background:none;border:0;color:var(--pine);font:inherit;text-decoration:underline;padding:0;cursor:pointer}
.cp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 10px}
.cp .t{font-size:13px;color:var(--mute);margin:0 0 6px;display:block}
.cp .cn{cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 0 14px}
.tile{border:0;border-radius:22px;padding:18px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 2px 0 rgba(179,90,18,.14)}
.t0{background:var(--t0)}.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}
.ico{font-size:60px;line-height:1}
.ln{font-weight:800;font-size:18px;text-align:center;overflow-wrap:anywhere}
.tile.plus{background:transparent;border:2px dashed var(--acc);color:var(--pine);box-shadow:none}
.tile.plus .ico{font-size:46px}
.back{background:none;border:0;font-size:36px;line-height:1;color:var(--ink);padding:0 6px 4px 0;cursor:pointer}
.ico2{font-size:30px;line-height:1}
.topin h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig{display:flex;flex-wrap:wrap;gap:8px}
.ib{font-size:26px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.tile{transition:transform .1s}.tile:active{transform:scale(.97)}}
#st{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:13px;display:none}
@media(prefers-reduced-motion:no-preference){li{transition:background .15s}li:active{background:var(--line)}}

/* ===== Family Luismaux: gris suave + azul y amarillo ===== */
:root{
 --bg:#edf1f6;--card:#ffffff;--ink:#172b49;--mute:#718096;
 --pine:#0863c9;--acc:#0875e8;--sun:#ffd51f;--line:#d7e0ec;
 --red:#d84b4b;--band:#0755b5;--t0:#e7f1ff;--t1:#edf5ff;--t2:#e6f3ff;--t3:#f2f5fa;color-scheme:light
}
html{background:#0755b5} body{background:var(--bg);color:var(--ink)}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;padding:12px 16px calc(108px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#0755b5,#087cf0);padding:14px 18px;border-bottom:1px solid #3c9bff;box-shadow:0 3px 12px #164b8520}
.topin{max-width:620px}
.topin img{width:54px;height:54px;object-fit:cover;border:2px solid #fff;border-radius:14px;box-shadow:0 3px 12px #002b6680}
.top h1{font-size:25px;color:white}
input,.ed select{background:#fff;border:1.5px solid #cbd8e8;color:#172b49;border-radius:14px;min-height:50px}
input::placeholder{color:#8998aa}
input:focus-visible{border-color:#0875e8;outline:2px solid #8fc5ff}
.add,.btn1{background:linear-gradient(135deg,#ffdc35,#ffbd00);color:#19365d;border-radius:14px;font-weight:800;box-shadow:0 3px 0 #d99c00}
.btn2{border-color:#0875e8;color:#0755b5;background:#fff}
h2{font-size:16px;color:#075fc2;font-weight:800;margin:22px 0 9px}
ul{background:transparent;border:0;border-radius:0;overflow:visible}
li{padding:13px 14px;border-color:#e1e8f1;min-height:60px}
.nm{font-size:17px}
.chk{width:28px;height:28px;border:2.5px solid #0875e8}
.done .chk{background:#ffd51f;border-color:#ffd51f;color:#18375f}
.x{font-size:23px;color:#718096}
.q{color:#075fc2}
.topin .back{color:#fff}
.who2{padding:14px 2px;color:#718096;font-size:13px}
.who2 b{color:#075fc2}
.acts{gap:18px;padding:4px 0 12px;flex-wrap:wrap}
.acts button{color:#52677f;font-size:14px}
.grid{gap:13px;padding:10px 0 18px}
.tile{min-height:150px;border-radius:23px;color:#fff;background:linear-gradient(145deg,#168bff,#0755bd);border:1px solid #49a5ff;box-shadow:0 4px 0 #06418e,0 8px 18px #244c761c}
.tile.t1{background:linear-gradient(145deg,#0878e8,#034cae)}
.tile.t2{background:linear-gradient(145deg,#1267c5,#06418b)}
.tile.t3{background:linear-gradient(145deg,#e7f1ff,#d4e5fa);border-color:#c4d8f0;color:#0755b5;box-shadow:0 4px 0 #b8cce3}
.ico{font-size:54px;filter:drop-shadow(0 3px 2px #00336a45)}
.ln{font-size:19px}
.tile.plus{background:#fff;border:2px dashed #0875e8;color:#075fc2;box-shadow:none}
.cp,.manage-card{background:#fff;border:1px solid #d7e0ec;border-radius:18px;box-shadow:0 3px 12px #31577c0b}
.cp .t{color:#718096}
.hab{gap:9px;margin:10px 0 16px}
.chip{background:#f3f7fc;border-color:#d7e0ec}
.cn{color:#172b49}
.cx{color:#718096}
.empty{color:#718096}
.login{padding-top:30px}
.login p{color:#718096}
.code{color:#075fc2}
.ig .ib{background:#f4f8fd;border-color:#d7e0ec}
#st{bottom:calc(96px + env(safe-area-inset-bottom));background:#0755b5;color:#fff}
#exit-toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,10px);display:block;visibility:hidden;opacity:0;pointer-events:none;z-index:2147483647;background:#17385f;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:800;line-height:1.25;box-shadow:0 6px 22px #10243d66;white-space:nowrap;text-align:center;transition:opacity .16s,transform .16s}
#exit-toast.show{visibility:visible;opacity:1;transform:translate(-50%,0)}
.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0878e8,#06469c);border-top:1px solid #5aaaff;box-shadow:0 -5px 20px #173b641f;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav-btn{border:0;background:transparent;color:#e5f2ff;border-radius:15px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.nav-btn .nav-ico{font-size:24px;line-height:1.1}
.nav-btn.active{background:linear-gradient(145deg,#fff,#e7f2ff);color:#0755b5;box-shadow:inset 0 0 0 1px #b5d8ff,0 2px 8px #00356d40}
.page-title{font-size:23px;font-weight:800;margin:12px 0 5px;color:#17385f}
.page-sub{font-size:14px;color:#718096;margin:0 0 16px}
.manage-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #e5ebf3}
.manage-row:last-child{border-bottom:0}
.manage-row .grow{flex:1;min-width:0}
.manage-row strong{display:block;font-size:16px}
.manage-row small{color:#718096}
.pill-action{border:1px solid #b9d4f3;background:#edf5ff;color:#0755b5;border-radius:12px;padding:8px 11px;font:inherit;font-weight:700}
.section-kicker{font-size:12px;color:#718096;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
/* Productos de la lista en tarjetas cuadradas */
.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;background:transparent;border:0}
.product-card{position:relative;min-width:0;min-height:150px;aspect-ratio:1/0.92;background:#fff;border:1px solid #d5dfeb;border-radius:19px;padding:13px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 3px 10px #284c7010;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.product-card:active{background:#f0f6ff}
.product-card.done{background:#e7f1ff;border:2px solid #0875e8}
.product-card .prod-icon{font-size:29px;line-height:1.1}
.product-card .nm{font-size:16px;font-weight:700;text-align:center;line-height:1.2;overflow-wrap:anywhere;flex:0 1 auto}
.product-card .q{font-size:13px;color:#718096}
.product-card .chk{position:absolute;top:9px;right:9px;width:25px;height:25px;background:#fff;border-color:#9aabc0}
.product-card.done .chk{background:#0875e8;border-color:#0875e8;color:#fff}
.product-card .card-edit-hint{font-size:10px;color:#8293a8;margin-top:1px}
/* Ventanas de edición: se recolocan dentro del viewport visible cuando aparece el teclado Android */
.edit-overlay{position:fixed;top:var(--vvtop,0px);left:0;right:0;height:var(--vvh,100dvh);z-index:1000;background:#10243d80;display:flex;align-items:center;justify-content:center;padding:10px 12px;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box}
.edit-dialog{width:min(100%,440px);max-height:calc(var(--vvh,100dvh) - 20px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scroll-padding:12px 0 100px;background:#fff;border-radius:22px;padding:0 18px 14px;box-shadow:0 18px 60px #001b3b55;color:#172b49;box-sizing:border-box}
.edit-dialog input,.edit-dialog select{scroll-margin-top:74px;scroll-margin-bottom:110px}
.edit-actions{position:sticky;bottom:0;background:#fff;padding:10px 0 max(12px,env(safe-area-inset-bottom));z-index:3}
html.keyboard-open .edit-overlay,html.keyboard-open .cat-edit-overlay{align-items:flex-start;justify-content:center;padding:6px 10px;overflow-y:auto}
html.keyboard-open .edit-dialog,html.keyboard-open .cat-edit-dialog{max-height:calc(var(--vvh,100dvh) - 12px);margin:0 auto;overscroll-behavior:contain}
html.keyboard-open .edit-title,html.keyboard-open .cat-edit-title{position:sticky;top:0;z-index:5}
html.keyboard-open .edit-actions,html.keyboard-open .cat-edit-actions{position:sticky;bottom:0;padding-bottom:10px;box-shadow:0 -6px 12px #ffffffdd}
.edit-title{margin:0 -18px 16px;padding:17px 18px;background:linear-gradient(120deg,#0755b5,#087cf0);color:#fff;border-radius:22px 22px 0 0;font-size:20px;font-weight:800}
.edit-dialog label{display:block;font-size:13px;font-weight:700;color:#52677f;margin:11px 0 5px}
.edit-dialog input,.edit-dialog select{width:100%;min-height:48px;background:#f8fbff;color:#172b49;border:1.5px solid #cbd8e8;border-radius:12px;padding:10px 12px;font:inherit}
.edit-actions{display:flex;gap:10px;margin-top:18px}
.edit-actions button{flex:1;min-height:47px}
@media(max-width:380px){.top h1{font-size:21px}.tile{min-height:136px}.ico{font-size:47px}.wrap{padding-left:13px;padding-right:13px}.product-card{min-height:137px}}

/* Ajuste solicitado: tarjetas de producto más compactas, no los dibujos internos */
.products-grid{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:8px}
.product-card{width:100%;justify-self:stretch;min-height:0;aspect-ratio:1/1;padding:8px 5px;border-radius:15px;gap:5px}
.product-card .prod-icon{font-size:24px}
.product-card .nm{font-size:13px;line-height:1.15}
.product-card .q{font-size:11px}
.product-card .chk{top:6px;right:6px;width:21px;height:21px}
@media(max-width:380px){.product-card{width:100%;min-height:0;aspect-ratio:1/1;padding:7px 4px}.product-card .nm{font-size:12px}}

/* ===== Corrección de la pantalla Categorías ===== */
.category-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:12px 0 22px;
}
.category-card{
  appearance:none;
  -webkit-appearance:none;
  min-width:0;
  min-height:112px;
  padding:12px 7px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid #d4e0ef;
  border-radius:17px;
  background:linear-gradient(160deg,#fff 0%,#f4f8fe 100%);
  color:#17385f;
  font:inherit;
  text-align:center;
  box-shadow:0 3px 9px #254d7612;
  cursor:pointer;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.category-card:active{background:#eaf3ff;transform:scale(.98)}
.category-card .cat-ico{font-size:30px;line-height:1.1;display:block}
.category-card strong{font-size:13px;line-height:1.15;font-weight:800;overflow-wrap:anywhere}
.category-card small{font-size:10px;line-height:1.15;color:#718096;overflow-wrap:anywhere}
.category-card:focus-visible{outline:3px solid #8fc5ff;outline-offset:2px}
.cat-edit-overlay{
  position:fixed;
  top:var(--vvtop,0px);
  left:0;right:0;
  height:var(--vvh,100dvh);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background:rgba(12,32,58,.58);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
}
.cat-edit-dialog{
  width:min(100%,460px);
  max-height: min(calc(var(--vvh,100dvh) - 24px),720px);
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-padding:16px 0 90px;
  padding:0 18px 18px;
  border:1px solid #d7e2f0;
  border-radius:22px;
  background:#fff;
  color:#172b49;
  box-shadow:0 18px 60px #001b3b55;
}
.cat-edit-title{
  position:sticky;
  top:0;
  z-index:1;
  margin:0 -18px 16px;
  padding:16px 18px;
  border-radius:21px 21px 0 0;
  background:linear-gradient(120deg,#0755b5,#087cf0);
  color:#fff;
  font-size:19px;
  font-weight:800;
}
.cat-edit-dialog label{display:block;margin:13px 0 6px;color:#52677f;font-size:13px;font-weight:800}
.cat-edit-dialog input{width:100%;min-height:48px;padding:11px 13px;border:1.5px solid #cbd8e8;border-radius:13px;background:#f8fbff;color:#172b49;font:inherit}
.cat-edit-dialog small{display:block;margin-top:8px;color:#718096;font-size:12px;line-height:1.4}
.cat-icon-picker{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:7px;
  margin-top:8px;
}
.cat-icon-picker button{
  appearance:none;
  -webkit-appearance:none;
  min-width:0;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  padding:3px;
  border:1.5px solid #d7e0ec;
  border-radius:11px;
  background:#f4f8fd;
  font-size:24px;
  cursor:pointer;
}
.cat-icon-picker button.selected{border:2px solid #0875e8;background:#e4f1ff;box-shadow:0 0 0 2px #0875e822}
.cat-edit-actions{position:sticky;bottom:-18px;z-index:3;display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;padding:10px 0 18px;background:#fff}
.cat-edit-actions button{flex:1 1 110px;min-height:46px;padding:10px 12px}
@media(max-width:390px){
 .category-grid{gap:8px}
 .category-card{min-height:104px;padding:10px 5px}
 .category-card .cat-ico{font-size:27px}
 .category-card strong{font-size:12px}
 .category-card small{font-size:9px}

(function installKeyboardViewport(){
  const vv=window.visualViewport;
  const update=()=>{
    // visualViewport.height è l'area realmente visibile sopra la tastiera.
    const h=vv?vv.height:window.innerHeight;
    const top=vv?vv.offsetTop:0;
    const keyboard=!!vv && (window.innerHeight-h>100 || (window.innerHeight-h>60 && document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)));
    document.documentElement.style.setProperty('--vvh',Math.max(180,h)+'px');
    document.documentElement.style.setProperty('--vvtop',Math.max(0,top)+'px');
    document.documentElement.classList.toggle('keyboard-open',keyboard);
  };
  update();
  if(vv){vv.addEventListener('resize',update);vv.addEventListener('scroll',update)}
  window.addEventListener('resize',update);
  document.addEventListener('focusin',event=>{
    const field=event.target;
    if(!field.matches('input,select,textarea'))return;
    update();
    const dialog=field.closest('.edit-dialog,.cat-edit-dialog');
    if(!dialog)return;
    // Desplaza solo el interior del cuadro, no toda la página detrás.
    [180,320].forEach(delay=>setTimeout(()=>{
      const a=field.getBoundingClientRect(),b=dialog.getBoundingClientRect();
      const topLimit=b.top+72, bottomLimit=b.bottom-112;
      if(a.bottom>bottomLimit)dialog.scrollTop+=a.bottom-bottomLimit;
      else if(a.top<topLimit)dialog.scrollTop-=topLimit-a.top;
    },delay));
  },true);
  document.addEventListener('focusout',()=>setTimeout(update,120),true);
})();;

// ---- Botón Atrás de Android: "Pulsa nuevamente para salir" ----
// Chrome ignora al pulsar Atrás las entradas de historial que una página crea sin que el
// usuario haya tocado la pantalla. Por eso la "guarda" se crea SOLO dentro de un toque
// (nunca al cargar ni desde un temporizador) y después NO se vuelve a crear: se recupera
// con history.forward(), que no crea entradas nuevas.
// Historial: [base, guarda]. Primer Atrás -> cae en "base": se enseña el aviso. Segundo
// Atrás (con el aviso visible) -> lo gestiona el sistema y cierra la app. Cuando el aviso
// desaparece, o el usuario toca la pantalla, se vuelve a la guarda con history.forward().
let exitArmed=false,exitTimer=null,fwdAt=0,fwdKnown=false;
const hasGuard=()=>!!(history.state&&history.state.fl==='guard');
const canFwd=()=>window.navigation?!!navigation.canGoForward:fwdKnown;
function toGuard(gesture){
  if(hasGuard())return;
  if(canFwd()){if(Date.now()-fwdAt>400){fwdAt=Date.now();fwdKnown=false;try{history.forward()}catch(e){}}return}
  if(gesture){try{history.pushState({fl:'guard'},'');fwdKnown=false}catch(e){}}
}
function showExitToast(){
  let toast=document.getElementById('exit-toast');
  if(!toast){toast=document.createElement('div');toast.id='exit-toast';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');document.body.appendChild(toast)}
  toast.textContent='Pulsa nuevamente para salir';
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
}
function disarmExit(gesture){
  clearTimeout(exitTimer);exitArmed=false;
  const t=document.getElementById('exit-toast');if(t)t.classList.remove('show');
  toGuard(gesture);
}
function armExit(){exitArmed=true;showExitToast();clearTimeout(exitTimer);exitTimer=setTimeout(()=>disarmExit(false),2500)}
// Cierra primero diálogos y paneles abiertos; devuelve true si cerró alguno.

  return false;

window.addEventListener('popstate',()=>{
  if(hasGuard())return;                       // estamos en la guarda: nada que hacer
  fwdKnown=true;                              // la guarda sigue ahí delante
  // Hemos caído en "base": el Atrás del usuario se ha consumido la guarda.
  if(closeOverlays()){toGuard(false);return}
  if(inList||navView!=='home'){goHome();toGuard(false);return}
  armExit();
});
['pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{

},true));

  p.setAttribute('d','M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z');

// ---- Copia de seguridad ----
function downloadText(name,text){
  const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function exportBackup(){
  if(setBusy)return;
  setBusy=true;setMsg='Preparando la copia…';render();
  try{
    const grab=async q=>(await q.get({source:'server'})).docs.map(d=>({id:d.id,data:d.data()}));
    const [listas,historial,categorias]=await Promise.all([grab(lcol()),grab(hcol()),grab(ccol())]);
    await Promise.all(listas.map(async l=>{l.items=await grab(lcol().doc(l.id).collection('items'))}));
    const now=new Date(),p2=n=>String(n).padStart(2,'0');
    const stamp=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
    downloadText('FamilyLuismaux-copia-'+stamp+'.json',JSON.stringify({app:'FamilyLuismaux',formato:1,fecha:now.toISOString(),listas,historial,categorias}));
    setMsg='Copia guardada: '+listas.length+' listas y '+listas.reduce((n,l)=>n+l.items.length,0)+' productos. La encontrarás en Descargas.';
  }catch(e){setMsg='No se pudo guardar la copia. Hace falta conexión.'}
  setBusy=false;render();
}
function pickBackupFile(){
  if(setBusy)return;

  inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];if(f)restoreBackup(f)});
  inp.click();
}
const cleanData=o=>{const r={};if(o&&typeof o==='object'&&!Array.isArray(o))for(const k of Object.keys(o)){const v=o[k];if(['string','number','boolean'].includes(typeof v))r[k]=v}return r};
const okId=id=>typeof id==='string'&&id.length>0&&id.length<200&&!id.includes('/');
async function restoreBackup(file){
  let d;
  try{d=JSON.parse(await file.text())}catch(e){setMsg='El archivo no es una copia válida.';render();return}
  if(!d||d.app!=='FamilyLuismaux'||!Array.isArray(d.listas)||!Array.isArray(d.historial)||!Array.isArray(d.categorias)){setMsg='Este archivo no es una copia de Family Luismaux.';render();return}
  if(!navigator.onLine){setMsg='Necesitas conexión para restaurar la copia.';render();return}
  const ops=[],add=(ref,data)=>ops.push([ref,cleanData(data)]);
  d.listas.forEach(l=>{
    if(!l||!okId(l.id))return;
    add(lcol().doc(l.id),l.data);
    (Array.isArray(l.items)?l.items:[]).forEach(i=>{if(i&&okId(i.id))add(lcol().doc(l.id).collection('items').doc(i.id),i.data)});
  });
  d.historial.forEach(h=>{if(h&&okId(h.id))add(hcol().doc(h.id),h.data)});
  d.categorias.forEach(c=>{if(c&&okId(c.id))add(ccol().doc(c.id),c.data)});
  const nProd=d.listas.reduce((n,l)=>n+(l&&Array.isArray(l.items)?l.items.length:0),0);
  const fecha=d.fecha&&!isNaN(new Date(d.fecha))?new Date(d.fecha).toLocaleDateString('es-ES'):'fecha desconocida';
  if(!confirm('Copia del '+fecha+':\n'+d.listas.length+' listas, '+nProd+' productos y '+d.categorias.length+' categorías.\n\nSe volverá a crear lo que falte y lo que coincida se sobrescribirá con lo de la copia. No se borra nada de lo actual.\n\n¿Restaurar?'))return;
  setBusy=true;setMsg='Restaurando…';render();
  try{
    for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([r,x])=>b.set(r,x));await b.commit()}
    setMsg='Copia restaurada ('+ops.length+' elementos).';
  }catch(e){setMsg='No se pudo restaurar. Inténtalo de nuevo con conexión.'}
  setBusy=false;render();
}
// Un toque fuera del panel de ajustes lo cierra
document.addEventListener('pointerdown',e=>{
  if(showSettings&&!(e.target.closest&&e.target.closest('.settings-panel,.gear-btn'))){showSettings=false;render()}

function salir(){started=false;showSettings=false;inList=false;showIcons=false;ls('fam',null);code=null;if(unsub)unsub();unsub=null;if(unsubL)unsubL();if(unsubH)unsubH();if(unsubC)unsubC();hist=[];custom=[];cur=null;login()}
function catsPanel(){
  if(!showCats)return '';
  const inp=$('input',{id:'cin',placeholder:'Nueva categoría (ej. Mascotas)','aria-label':'Nueva categoría'});
  const addC=()=>{
    const n=inp.value.trim();if(!n)return;
    if(cats().some(c=>c.toLowerCase()===n.toLowerCase()))return alert('Esa categoría ya existe.');
    ccol().add({name:n.charAt(0).toUpperCase()+n.slice(1),ts:Date.now()});inp.value='';
  };

    $('div',{class:'bar',style:'position:static;padding:4px 0 0'},inp,$('button',{class:'add',onclick:addC},'Crear')));

function add(raw){
  raw=raw.trim();if(!raw||!cur)return;
  let q='',n=raw;const m=raw.match(/^(\d+(?:[.,]\d+)?\s?(?:kg|g|l|ud|uds)?)\s+(.+)$/i);
  if(m){q=m[1];n=m[2]}
  n=n.charAt(0).toUpperCase()+n.slice(1);
  put(n,q);
}
function put(n,q,c){
  const k=key(n);
  if(items.some(i=>!i.done&&key(i.name)===k))return;
  const ex=items.find(i=>i.done&&key(i.name)===k);
  const hh=hist.find(x=>key(x.name)===k);
  c=c||(hh&&hh.cat&&cats().includes(hh.cat)?hh.cat:null)||catOf(n);
  if(ex)col().doc(ex.id).update({done:false});
  else col().add({name:n,qty:q,cat:c,done:false,by:me,ts:Date.now()});
  hcol().doc(k).set({name:n,qty:q,cat:c,count:firebase.firestore.FieldValue.increment(1),last:Date.now()},{merge:true});
}
function habs(){
  const pend=new Set(items.filter(i=>!i.done).map(i=>key(i.name)));
  const h=hist.filter(x=>x.name&&!pend.has(key(x.name))).slice(0,12);
  if(!h.length)return '';
  return $('div',{class:'hab'},$('span',{class:'t'},'Habituales'),h.map(x=>
    $('span',{class:'chip'},
      $('button',{class:'cn',onclick:()=>put(x.name,x.qty||'',x.cat)},x.name),
      $('button',{class:'cx','aria-label':'Quitar '+x.name+' de habituales',onclick:()=>hcol().doc(key(x.name)).delete()},'×'))));
}
const toggle=i=>col().doc(i.id).update({done:!i.done});
const del=i=>col().doc(i.id).delete();
const clearDone=()=>{const b=db.batch();items.filter(i=>i.done).forEach(i=>b.delete(col().doc(i.id)));b.commit()};

function productIcon(i){
  const n=(i.name||'').toLowerCase(),c=catKey(i);
  const map=[['leche','🥛'],['yogur','🥣'],['cerveza','🍺'],['agua','💧'],['pan','🥖'],['tomate','🍅'],['manzana','🍎'],['plátano','🍌'],['platano','🍌'],['queso','🧀'],['huevo','🥚'],['pollo','🍗'],['pescado','🐟'],['café','☕'],['cafe','☕'],['arroz','🍚'],['pasta','🍝'],['sal','🧂'],['mejill','🦪'],['lavavajillas','🧼'],['detergente','🧴'],['papel','🧻'],['aceite','🫒'],['zumo','🧃']];
  for(const [k,v] of map)if(n.includes(k))return v;
  return ({'Frutas y verduras':'🥦','Lácteos y huevos':'🥛','Carne y pescado':'🥩','Panadería y dulces':'🥐','Despensa':'🛒','Bebidas':'🥤','Limpieza e higiene':'🧽','Otros':'📦'})[c]||'🛍️';
}
function editRow(i){
  const n=$('input',{value:i.name,'aria-label':'Nombre del producto'});
  const q=$('input',{value:i.qty||'',placeholder:'Cantidad (ej. 2, 500 g)','aria-label':'Cantidad'});
  const c=$('select',{'aria-label':'Categoría'},cats().map(o=>$('option',o===i.cat?{selected:''}:{},o)));
  const save=()=>{
    const nm=n.value.trim();if(!nm)return n.focus();
    editing=null;
    hcol().doc(key(nm)).set({name:nm.charAt(0).toUpperCase()+nm.slice(1),cat:c.value,count:firebase.firestore.FieldValue.increment(0)},{merge:true});
    col().doc(i.id).update({name:nm.charAt(0).toUpperCase()+nm.slice(1),qty:q.value.trim(),cat:c.value});
    render();
  };
  [n,q].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')save()}));
  const overlay=$('div',{class:'edit-overlay',onclick:e=>{if(e.target===overlay){editing=null;render()}}});
  const dialog=$('div',{class:'edit-dialog',onclick:e=>e.stopPropagation()},
    $('div',{class:'edit-title'},'✎  Editar producto'),
    $('label',{},'Nombre del producto'),n,
    $('label',{},'Cantidad'),q,
    $('label',{},'Categoría'),c,
    $('div',{class:'edit-actions'},$('button',{class:'btn1',onclick:save},'Guardar'),$('button',{class:'btn2',onclick:()=>{editing=null;render()}},'Cancelar')));
  overlay.append(dialog);setTimeout(()=>n.focus(),0);return overlay;
}
let longPressTimer=null,longPressTriggered=false;
function row(i){
  if(editing===i.id)return editRow(i);
  const card=$('div',{class:'product-card'+(i.done?' done':''),role:'button','aria-label':i.name+'. Mantén pulsado para editar.'});
  const startPress=()=>{longPressTriggered=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressTriggered=true;editing=i.id;render()},550)};
  const endPress=()=>clearTimeout(longPressTimer);
  card.addEventListener('pointerdown',startPress);
  card.addEventListener('pointerup',endPress);
  card.addEventListener('pointerleave',endPress);
  card.addEventListener('pointercancel',endPress);
  card.addEventListener('contextmenu',e=>{e.preventDefault();longPressTriggered=true;editing=i.id;render()});
  card.addEventListener('click',()=>{if(longPressTriggered){longPressTriggered=false;return}toggle(i)});
  card.append($('span',{class:'chk'},'✓'),$('span',{class:'prod-icon','aria-hidden':'true'},productIcon(i)),$('span',{class:'nm'},i.name),i.qty?$('span',{class:'q'},i.qty):$('span',{class:'q'},' '));
  return card;
}

const CATEGORY_ICON_OPTIONS=['🥬','🥛','🥩','🥖','🧺','🥤','🧽','🧴','🍎','🍌','🍅','🧀','🥚','🍗','🐟','🍚','🍝','🧂','🧊','🍕','🍫','☕','🧻','🧼','🏠','🐶','📦','🛒','🌿','🧹'];
const DEFAULT_CATEGORY_ICONS={'Frutas y verduras':'🥬','Lácteos y huevos':'🥛','Carne y pescado':'🥩','Panadería y dulces':'🥖','Despensa':'🧺','Bebidas':'🥤','Limpieza e higiene':'🧽','Otros':'📦'};
const categoryIcon=name=>catIcons[name]||DEFAULT_CATEGORY_ICONS[name]||'🏷️';
function editCategory(c,isSystem){
  categoryEditing={...c,isSystem};render();
}
async function renameCategoryEverywhere(c,nm,icon){
  const refs=[];
  const collect=q=>q.get({source:'server'}).then(r=>r.docs.forEach(d=>refs.push(d.ref)));
  await Promise.all([
    ...lists.map(l=>collect(lcol().doc(l.id).collection('items').where('cat','==',c.name))),
    collect(hcol().where('cat','==',c.name))
  ]);
  for(let i=0;i<refs.length;i+=400){
    const b=db.batch();refs.slice(i,i+400).forEach(r=>b.update(r,{cat:nm}));await b.commit();
  }
  await ccol().doc(c.id).update({name:nm,icon});
}
function categoryEditor(){
  if(!categoryEditing)return '';
  const c=categoryEditing, name=$('input',c.isSystem?{value:c.name,placeholder:'Nombre de la categoría',disabled:''}:{value:c.name,placeholder:'Nombre de la categoría'});
  let selected=c.icon||categoryIcon(c.name);
  const picker=$('div',{class:'cat-icon-picker'},CATEGORY_ICON_OPTIONS.map(icon=>$('button',{type:'button',class:icon===selected?'selected':'',title:'Usar '+icon,onclick:e=>{selected=icon;picker.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.textContent===icon))}},icon)));
  const close=()=>{categoryEditing=null;render()};
  let saving=false;
  const save=async()=>{
    if(saving)return;
    const newName=(name.value||'').trim();if(!newName)return name.focus();
    const nm=newName.charAt(0).toUpperCase()+newName.slice(1);
    if(c.isSystem){ccol().doc('sys-'+key(c.name)).set({system:true,name:c.name,icon:selected,ts:Date.now()},{merge:true});close();return}
    if(cats().some(x=>x!==c.name&&x.toLowerCase()===nm.toLowerCase()))return alert('Ya existe una categoría con ese nombre.');
    if(nm===c.name){ccol().doc(c.id).update({icon:selected});close();return}
    saving=true;
    try{await renameCategoryEverywhere(c,nm,selected)}
    catch(e){saving=false;return alert('No se pudo renombrar la categoría. Hace falta conexión para actualizar también sus productos. Inténtalo de nuevo.')}
    close();
  };
  const overlay=$('div',{class:'cat-edit-overlay',onclick:e=>{if(e.target===overlay)close()}});
  const actions=[$('button',{class:'btn1',onclick:save},'Guardar'),$('button',{class:'btn2',onclick:close},'Cancelar')];
  if(!c.isSystem)actions.unshift($('button',{class:'btn2',onclick:()=>{if(confirm('¿Borrar la categoría "'+c.name+'"? Sus productos pasarán a Otros.')){ccol().doc(c.id).delete();close()}}},'Borrar'));
  const dialog=$('div',{class:'cat-edit-dialog',onclick:e=>e.stopPropagation()},
    $('div',{class:'cat-edit-title'},'✎  Editar categoría'),
    $('label',{},'Nombre de la categoría'),name,
    c.isSystem?$('small',{},'Las categorías integradas mantienen su nombre para no alterar la clasificación de productos existentes.'):'',
    $('label',{},'Selecciona un icono'),picker,
    $('div',{class:'cat-edit-actions'},actions));
  overlay.append(dialog);return overlay;
}
let categoryPressTimer=null,categoryLongPressTriggered=false;
function categoryCard(c,isSystem,countLabel){
  const card=$('button',{class:'category-card',type:'button','aria-label':c.name+'. Mantén pulsado para editar.'},
    $('span',{class:'cat-ico','aria-hidden':'true'},c.icon||categoryIcon(c.name)),
    $('strong',{},c.name),$('small',{},countLabel|| (isSystem?'Categoría integrada':'Categoría personalizada')));
  const start=()=>{categoryLongPressTriggered=false;clearTimeout(categoryPressTimer);categoryPressTimer=setTimeout(()=>{categoryLongPressTriggered=true;editCategory(c,isSystem)},550)};
  const stop=()=>clearTimeout(categoryPressTimer);
  card.addEventListener('pointerdown',start);card.addEventListener('pointerup',stop);card.addEventListener('pointerleave',stop);card.addEventListener('pointercancel',stop);
  card.addEventListener('contextmenu',e=>{e.preventDefault();categoryLongPressTriggered=true;editCategory(c,isSystem)});
  card.addEventListener('click',()=>{if(categoryLongPressTriggered){categoryLongPressTriggered=false;return}});
  return card;
}
function renderCategoriesPage(){
  const inp=$('input',{id:'cin',placeholder:'Nombre de la nueva categoría','aria-label':'Nueva categoría'});
  const addC=()=>{

  };

let msgTimer=null;
function showMsg(t){
  let e=document.getElementById('msg-toast');
  if(!e){e=document.createElement('div');e.id='msg-toast';e.setAttribute('role','status');e.setAttribute('aria-live','polite');document.body.appendChild(e)}
  e.textContent=t;e.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>e.classList.remove('show'),2200);
}
let prodTarget=null;
const prodTargetId=()=>(lists.find(l=>l.id===prodTarget)||lists.find(l=>l.id===cur)||lists[0]||{}).id;
function targetRow(){
  if(lists.length<2)return '';
  const sel=$('select',{'aria-label':'Lista donde se añaden los productos',onchange:()=>{prodTarget=sel.value}},
    lists.map(l=>$('option',l.id===prodTargetId()?{value:l.id,selected:''}:{value:l.id},(l.icon||'📝')+' '+l.name)));
  return $('div',{class:'target-row'},$('span',{},'Añadir a:'),sel);
}
function addProductFromCatalog(name,qty,cat,target){
  const t=lists.find(l=>l.id===target)||lists.find(l=>l.id===cur)||lists[0];
  if(!t)return alert('Crea primero una lista de compra.');
  const normalized=name.charAt(0).toUpperCase()+name.slice(1);
  const productKey=key(normalized);
  const ref=lcol().doc(t.id).collection('items');
  ref.get().then(s=>{
    const same=s.docs.filter(d=>d.data().name&&key(d.data().name)===productKey);
    if(same.some(d=>!d.data().done)){showMsg('Ya está en «'+t.name+'»');return}
    const hh=hist.find(x=>key(x.name)===productKey);
    const c=cat||(hh&&hh.cat&&cats().includes(hh.cat)?hh.cat:null)||catOf(normalized);
    const done=same.find(d=>d.data().done);
    if(done)done.ref.update({done:false});
    else ref.add({name:normalized,qty:qty||'',cat:c,done:false,by:me,ts:Date.now()});
    hcol().doc(productKey).set({name:normalized,qty:qty||'',cat:c,count:firebase.firestore.FieldValue.increment(1),last:Date.now()},{merge:true});
    showMsg('Añadido a «'+t.name+'»');
  }).catch(e=>alert('No se pudo añadir el producto: '+e.message));
}
function renderProductsPage(){
  const inp=$('input',{id:'pin',placeholder:'Añadir producto (ej. 2 leche)','aria-label':'Nombre del producto'});
  const addP=()=>{
    const raw=inp.value.trim();if(!raw)return;
    let qty='',name=raw;const m=raw.match(/^(\d+(?:[.,]\d+)?\s?(?:kg|g|l|ud|uds)?)\s+(.+)$/i);
    if(m){qty=m[1];name=m[2]}
    addProductFromCatalog(name,qty,undefined,prodTargetId());inp.value='';
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
  const productRows=hist.filter(x=>x.name).slice(0,40);
  app.replaceChildren(topBar(),$('div',{class:'wrap'},
    $('div',{class:'page-title'},'Productos'),
    $('p',{class:'page-sub'},'Añade rápidamente productos a tu lista desde tu catálogo habitual.'),
    targetRow(),$('div',{class:'bar'},inp,$('button',{class:'add',onclick:addP},'Añadir')),
    $('div',{class:'section-kicker'},'Productos habituales'),
    productRows.length?$('div',{class:'manage-card'},productRows.map(p=>$('div',{class:'manage-row'},
      $('span',{class:'ico2'},'🛍️'),
      $('div',{class:'grow'},$('strong',{},p.name),$('small',{},p.cat||'Otros')),
      $('button',{class:'pill-action',onclick:()=>addProductFromCatalog(p.name,p.qty||'',p.cat,prodTargetId())},'+ Añadir')))):
      $('div',{class:'empty'},'Aún no hay productos habituales. Añade productos a una lista y aparecerán aquí.')),
    bottomNav());
}
function renderList(){
  const l=lists.find(x=>x.id===cur)||{name:'Lista',icon:'📝'};
  const input=$('input',{id:'in',placeholder:'Añadir producto (ej. 2 leche)',enterkeyhint:'done',list:'sug',autocomplete:'off'});
  const names=[...new Set([...hist.map(h=>h.name),...items.map(i=>i.name)])];
  const dl=$('datalist',{id:'sug'},names.map(n=>$('option',{value:n})));
  const go=()=>{add(input.value);input.value='';input.focus()};
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  const pend=items.filter(i=>!i.done),done=items.filter(i=>i.done);
  const body=[];
  if(!items.length)body.push($('div',{class:'empty'},'La lista está vacía. Escribe arriba lo primero que necesitéis.'));
  for(const c of cats()){
    const g=pend.filter(i=>catKey(i)===c);
    if(g.length)body.push($('h2',{},c),$('div',{class:'products-grid'},g.map(row)));
  }
  if(done.length)body.push($('div',{class:'head'},$('h2',{},'Comprados ('+done.length+')'),$('button',{class:'clr',onclick:clearDone},'Quitar comprados')),$('div',{class:'products-grid'},done.map(row)));
  app.replaceChildren(topBar(),listBar(l),$('div',{class:'wrap'},
    $('div',{class:'acts'},$('button',{onclick:renameList},'Renombrar'),$('button',{onclick:()=>{showIcons=!showIcons;render()}},'Icono'),$('button',{onclick:delList},'Borrar lista')),
    iconsPanel(),
    $('div',{class:'bar'},input,dl,$('button',{class:'add',onclick:go},'Añadir')),
    habs(),$('p',{class:'page-sub'},'Marca un producto con un toque. Mantén pulsado para editarlo.'),body,bottomNav()));
}
// Los cambios que llegan de otros móviles no redibujan la pantalla si hay un cuadro de edición abierto
// (así no se pierde lo que se está escribiendo). Al cerrar el cuadro se redibuja con los datos nuevos.
function measureHead(){const h=document.querySelector('.top');if(h)document.documentElement.style.setProperty('--headh',h.offsetHeight+'px')}
addEventListener('resize',measureHead);
function softRender(){if(document.querySelector('.edit-overlay,.cat-edit-overlay'))return;render()}
function render(){
  const keep=['in','cin','pin'].map(id=>{const e=document.getElementById(id);return e?[id,e.value,document.activeElement===e]:null});
  if(inList)renderList();
  else if(navView==='categories')renderCategoriesPage();
  else if(navView==='products')renderProductsPage();
  else renderHome();
  keep.forEach(k=>{if(!k)return;const e=document.getElementById(k[0]);if(e){e.value=k[1];if(k[2])e.focus()}});
  measureHead();
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(me&&code)?start():login();
